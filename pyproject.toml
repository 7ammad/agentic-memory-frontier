[project]
name = "agentic-memory-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "cem-core",
  "cem-eval",
  "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
cem-core = { path = "packages/cem-core", editable = true }
cem-eval = { path = "packages/cem-eval", editable = true }

[tool.pytest.ini_options]
pythonpath = [
  "packages/cem-core/src",
  "packages/cem-eval/src",
]
testpaths = ["tests"]
addopts = "-q"
